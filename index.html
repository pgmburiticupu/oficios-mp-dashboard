<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9XPY49NV0Z"></script>
<script>
var T=atob('bnRuXzMzNjYzMDY3NzQ5OEtxS0NEckFZaERvMk92ZmtjSExCdGVacUVKWERVRURlZlU=');
var D1='2e27d679a665812da9cbdabaab1fa104';
var D2='36e7d679a6658120b0e2d3eb272755bd';
var D3='36f7d679a6658161 9f26ed14687e0b9a'.split(' ').join('');
var PROXY='https://notion-proxy.pgmburiticupu.workers.dev';
var SHEETS='https://script.google.com/macros/s/AKfycbyU9l6mkXUYKyJABW8K-KB-yiHs8eHp_HDO4-JwQhe5h7mF8QeiZHkXMPo08drUZdBuow/exec';
var GA_ID='G-9XPY49NV0Z';
var CHAVE='Senha123';
var ofRows=[],num2Rows=[],num3Rows=[],afOf='all',afNum2='all',afNum3='all';

// ===== LOGIN =====
function doLogin(){
  var u=document.getElementById('login-user').value.trim().toLowerCase();
  var p=document.getElementById('login-pass').value;
  var rem=document.getElementById('remember-me').checked;
  var err=document.getElementById('login-error');
  if(u==='pgm'&&p==='12345'){
    sessionStorage.setItem('pgm_auth','ok');
    if(rem){localStorage.setItem('pgm_auth','ok');localStorage.setItem('pgm_user',u);}
    document.getElementById('login-screen').style.display='none';
    checkIdentificacao();
  } else {
    err.style.display='block';
    document.getElementById('login-pass').value='';
    document.getElementById('login-pass').focus();
  }
}
function checkAuth(){
  if(localStorage.getItem('pgm_auth')==='ok'){
    document.getElementById('login-user').value=localStorage.getItem('pgm_user')||'';
    document.getElementById('remember-me').checked=true;
    document.getElementById('login-screen').style.display='none';
    checkIdentificacao();return;
  }
  if(sessionStorage.getItem('pgm_auth')==='ok'){
    document.getElementById('login-screen').style.display='none';
    checkIdentificacao();
  }
}

// ===== IDENTIFICACAO =====
function toggleNovoAcesso(){
  var sel=document.getElementById('id-nome');
  var box=document.getElementById('novo-acesso-box');
  if(box) box.style.display=sel.value==='__novo__'?'block':'none';
}
function doIdentificar(){
  var sel=document.getElementById('id-nome');
  var err=document.getElementById('id-error');
  err.style.display='none';
  if(sel.value==='__novo__'){
    var novoNome=document.getElementById('id-novo-nome').value.trim();
    var chave=document.getElementById('id-chave').value;
    if(!novoNome){err.style.display='block';err.textContent='Digite seu nome.';return;}
    if(chave!==CHAVE){err.style.display='block';err.textContent='Palavra-chave incorreta.';document.getElementById('id-chave').value='';return;}
    entrarComNome(novoNome,true);
  } else {
    var nome=sel.value;
    if(!nome){err.style.display='block';err.textContent='Selecione seu nome.';return;}
    entrarComNome(nome,false);
  }
}
function entrarComNome(nome,isNovo){
  localStorage.setItem('pgm_nome',nome);
  localStorage.setItem('pgm_identificado','ok');
  sessionStorage.setItem('pgm_id_sessao','ok');
  registrarNoSheets(nome,isNovo?'Novo cadastro':'Acesso','');
  if(typeof gtag!=='undefined'){
    gtag('config',GA_ID,{user_id:nome});
    gtag('set','user_properties',{servidor:nome});
    gtag('event','login',{servidor:nome});
  }
  document.getElementById('id-screen').classList.remove('show');
  mostrarBadge(nome);
  loadOf();
}
function checkIdentificacao(){
  var nome=localStorage.getItem('pgm_nome');
  if(nome){
    var sel=document.getElementById('id-nome');
    if(sel){for(var i=0;i<sel.options.length;i++){if(sel.options[i].value===nome){sel.selectedIndex=i;break;}}}
  }
  document.getElementById('id-screen').classList.add('show');
}
function mostrarBadge(nome){
  function _set(){
    var b=document.getElementById('user-badge');
    if(b){b.innerHTML='&#128100; <span>'+nome+'</span>';b.style.display='flex';}
  }
  _set(); setTimeout(_set,300); setTimeout(_set,800);
}
function registrarNoSheets(nome,acao,detalhe){
  try{
    var disp=/Mobi|Android/i.test(navigator.userAgent)?'Celular':'Computador';
    var url=SHEETS+'?servidor='+encodeURIComponent(nome)+'&dispositivo='+encodeURIComponent(disp)+'&acao='+encodeURIComponent(acao||'Acesso')+'&detalhe='+encodeURIComponent(detalhe||'');
    fetch(url,{method:'GET',mode:'no-cors'});
  }catch(e){console.log('Sheets:',e);}
}

// ===== ABAS =====
function switchTab(tab,btn){
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  ['oficios','numeros','pareceres'].forEach(function(t){document.getElementById('tab-'+t).style.display=t===tab?'':'none';});
  if(tab==='numeros'&&num2Rows.length===0)loadNums(D2,'num2','n2','error-box-2');
  if(tab==='pareceres'&&num3Rows.length===0)loadNums(D3,'num3','n3','error-box-3');
}

// ===== OFICIOS =====
async function loadOf(){
  try{
    var today=new Date();today.setHours(0,0,0,0);
    var r=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({notionToken:T,databaseId:D1,payload:{filter:{property:'Respondido',checkbox:{equals:false}},sorts:[{property:'Data do Vencimento',direction:'ascending'}],page_size:100}})});
    var d=await r.json();
    if(!d.results)throw new Error(JSON.stringify(d).substring(0,100));
    ofRows=d.results.map(function(pg){
      var pp=pg.properties;
      var tKey=Object.keys(pp).find(function(k){return pp[k].type==='title';});
      var titulo=tKey?(pp[tKey].title||[]).map(function(t){return t.plain_text;}).join(''):pg.id;
      var pr=(pp['Data do Vencimento']&&pp['Data do Vencimento'].date&&pp['Data do Vencimento'].date.start)||(pp['Novo Vencimento']&&pp['Novo Vencimento'].date&&pp['Novo Vencimento'].date.start)||'';
      var pd=pr?new Date(pr+'T00:00:00'):null;
      var da=pd?Math.floor((today-pd)/86400000):null;
      var resp=(pp['Responsavel']&&pp['Responsavel'].select&&pp['Responsavel'].select.name)||'';
      return{id:pg.id,t:titulo||pg.id,p:pr,d:da,r:resp,u:pg.url};
    });
    rcOf();renderOf(afOf,'');
    document.getElementById('loading-of').style.display='none';
    document.getElementById('table-of').style.display='table';
    document.getElementById('last-update').textContent='Atualizado: '+new Date().toLocaleString('pt-BR');
  }catch(e){
    document.getElementById('loading-of').style.display='none';
    var b=document.getElementById('error-box-1');b.style.display='block';b.textContent='Erro: '+e.message;
  }
}
function gcOf(d){if(d===null)return'sp';if(d>30)return'critico';if(d>=15)return'alto';if(d>=1)return'atraso';return'avencer';}
function gbOf(d){if(d===null)return'<span class="badge badge-avencer">Sem prazo</span>';if(d>30)return'<span class="badge badge-critico">Critico</span>';if(d>=15)return'<span class="badge badge-alto">Alto</span>';if(d>=1)return'<span class="badge badge-atraso">Em atraso</span>';if(d===0)return'<span class="badge badge-hoje">Vence hoje</span>';return'<span class="badge badge-avencer">A vencer</span>';}
function gdOf(d){if(d===null)return'-';var c=d>0?(d>30?'dias-red':'dias-amber'):'dias-blue';return'<span class="dias-num '+c+'">'+(d>0?'+'+d:d)+'</span>';}
function rcOf(){document.getElementById('c-total').textContent=ofRows.length;document.getElementById('c-atraso').textContent=ofRows.filter(function(r){return r.d>0;}).length;document.getElementById('c-critico').textContent=ofRows.filter(function(r){return r.d>30;}).length;document.getElementById('c-ok').textContent=ofRows.filter(function(r){return r.d!==null&&r.d<=0;}).length;}
function filterOf(f,btn){document.querySelectorAll('#tab-oficios .filter-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');afOf=f;renderOf(f,document.getElementById('search-of').value);}
function renderOf(f,s){
  var q=s.toLowerCase();
  var fl=ofRows.filter(function(r){return(f==='all'||gcOf(r.d)===f)&&(!q||r.t.toLowerCase().includes(q)||r.r.toLowerCase().includes(q));});
  var tb=document.getElementById('tbody-of');
  if(!fl.length){tb.innerHTML='';document.getElementById('table-of').style.display='none';document.getElementById('empty-of').style.display='block';return;}
  document.getElementById('table-of').style.display='table';document.getElementById('empty-of').style.display='none';
  tb.innerHTML=fl.map(function(r){return'<tr id="row-'+r.id+'"><td><a href="'+r.u+'" target="_blank" style="color:#1a1a2e;text-decoration:none;font-weight:500">'+r.t+'</a></td><td style="white-space:nowrap;color:#6b7280">'+(r.p?new Date(r.p+'T00:00:00').toLocaleDateString('pt-BR'):'-')+'</td><td class="resp">'+(r.r||'-')+'</td><td style="text-align:center">'+gdOf(r.d)+'</td><td style="text-align:center">'+gbOf(r.d)+'</td><td style="text-align:center"><button class="btn-resp" onclick="marcarOf(''+r.id+'',this)">Responder</button></td></tr>';}).join('');
}
async function marcarOf(id,btn){
  if(!confirm('Marcar como respondido? A data de hoje sera registrada.'))return;
  btn.disabled=true;btn.textContent='Salvando...';
  var r=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'update',notionToken:T,pageId:id})});
  var d=await r.json();
  if(d.object==='error'){btn.disabled=false;btn.textContent='Responder';alert('Erro: '+d.message);return;}
  var tr=document.getElementById('row-'+id);
  var tituloOf=tr&&tr.querySelector('a')?tr.querySelector('a').textContent:'Oficio';
  var nomeSrv=localStorage.getItem('pgm_nome')||'Desconhecido';
  registrarNoSheets(nomeSrv,'Respondeu oficio',tituloOf);
  tr.classList.add('success-row');btn.textContent='Respondido!';btn.style.background='#16a34a';btn.style.color='white';
  setTimeout(function(){ofRows=ofRows.filter(function(x){return x.id!==id;});rcOf();renderOf(afOf,document.getElementById('search-of').value);},2000);
}

// ===== NUMEROS =====
async function loadNums(dbId,prefix,cp,errId){
  try{
    var all=[],cursor;
    do{
      var payload={page_size:100};
      if(cursor)payload.start_cursor=cursor;
      var r=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({notionToken:T,databaseId:dbId,payload:payload})});
      var d=await r.json();
      if(!d.results)throw new Error(JSON.stringify(d).substring(0,100));
      all=all.concat(d.results);
      cursor=d.has_more?d.next_cursor:null;
    }while(cursor);
    var rows=all.map(function(pg){
      var pp=pg.properties;
      var tKey=Object.keys(pp).find(function(k){return pp[k].type==='title';});
      var n=parseInt(tKey?(pp[tKey].title||[]).map(function(t){return t.plain_text;}).join(''):'0')||0;
      return{id:pg.id,n:n,usado:!!(pp['Usado']&&pp['Usado'].checkbox),data:(pp['Data de Uso']&&pp['Data de Uso'].date&&pp['Data de Uso'].date.start)||''};
    }).sort(function(a,b){return a.n-b.n;});
    if(prefix==='num2')num2Rows=rows;else num3Rows=rows;
    rcNums(rows,cp);renderNums(rows,prefix,'all');
    document.getElementById('loading-'+prefix).style.display='none';
    document.getElementById('grid-'+prefix).style.display='grid';
  }catch(e){
    document.getElementById('loading-'+prefix).style.display='none';
    var b=document.getElementById(errId);b.style.display='block';b.textContent='Erro: '+e.message;
  }
}
function rcNums(rows,p){
  var us=rows.filter(function(r){return r.usado;}).length;
  var li=rows.filter(function(r){return!r.usado;}).length;
  var pr=rows.find(function(r){return!r.usado;});
  document.getElementById(p+'-total').textContent=rows.length;
  document.getElementById(p+'-usado').textContent=us;
  document.getElementById(p+'-livre').textContent=li;
  document.getElementById(p+'-proximo').textContent=pr?'Nr '+pr.n:'Esgotado';
}
function fNum(prefix,f,btn){
  var tabId=prefix==='num2'?'tab-numeros':'tab-pareceres';
  document.querySelectorAll('#'+tabId+' .filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  if(prefix==='num2')afNum2=f;else afNum3=f;
  renderNums(prefix==='num2'?num2Rows:num3Rows,prefix,f);
}
function renderNums(rows,prefix,f){
  var fl=rows.filter(function(r){return f==='all'||(f==='usado'&&r.usado)||(f==='livre'&&!r.usado);});
  var grid=document.getElementById('grid-'+prefix);
  var empty=document.getElementById('empty-'+prefix);
  if(!fl.length){grid.style.display='none';empty.style.display='block';return;}
  grid.style.display='grid';empty.style.display='none';
  grid.innerHTML=fl.map(function(r){
    return'<div class="num-cell '+(r.usado?'usado':'livre')+'" id="nc-'+r.id+'" onclick="tgNum(''+r.id+'','+r.n+','+r.usado+',''+prefix+'')">'+(r.usado?'&#x2705; ':'')+r.n+'</div>';
  }).join('');
}
async function tgNum(id,num,usado,prefix){
  if(!confirm(usado?'Desmarcar o numero '+num+'?':'Marcar o numero '+num+' como usado?'))return;
  var el=document.getElementById('nc-'+id);
  el.classList.add('saving');el.onclick=null;el.textContent='...';
  var r=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:usado?'unmarkUsed':'markUsed',notionToken:T,pageId:id})});
  var d=await r.json();
  if(d.object==='error'){el.classList.remove('saving');el.textContent=(usado?'&#x2705; ':'')+num;el.onclick=function(){tgNum(id,num,usado,prefix);};alert('Erro: '+d.message);return;}
  var nomeSrv=localStorage.getItem('pgm_nome')||'Desconhecido';
  var tipo=prefix==='num2'?'Num. Oficio-PGM':'Num. Parecer-PGM';
  registrarNoSheets(nomeSrv,(usado?'Desmarcou':'Marcou')+' numero ('+tipo+')',String(num));
  var rows=prefix==='num2'?num2Rows:num3Rows;
  var row=rows.find(function(x){return x.id===id;});
  if(row){row.usado=!usado;row.data=usado?'':new Date().toISOString().split('T')[0];}
  rcNums(rows,prefix==='num2'?'n2':'n3');
  renderNums(rows,prefix,prefix==='num2'?afNum2:afNum3);
}

checkAuth();
</script>
</body>
</html>
