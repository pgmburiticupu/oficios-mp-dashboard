<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Oficios MP 2026</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',sans-serif;background:#f4f6f9;color:#1a1a2e}header{background:#1a1a2e;color:white;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}header h1{font-size:20px;font-weight:600}.subtitle{font-size:13px;opacity:.65;margin-top:2px}#last-update{font-size:12px;opacity:.6}.container{max-width:1200px;margin:0 auto;padding:24px 20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}.card{background:white;border-radius:10px;padding:16px 18px;border:1px solid #e5e7eb}.card .label{font-size:12px;color:#6b7280;margin-bottom:6px}.card .value{font-size:28px;font-weight:700}.card.total .value{color:#1a1a2e}.card.atrasado .value{color:#b91c1c}.card.critico .value{color:#92400e}.card.ok .value{color:#1d6534}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}.filter-btn{padding:6px 14px;border-radius:999px;border:1px solid #d1d5db;background:white;font-size:13px;cursor:pointer;color:#374151}.filter-btn.active{background:#1a1a2e;color:white;border-color:#1a1a2e}#search{margin-left:auto;padding:6px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;width:220px;outline:none}.table-wrap{background:white;border-radius:10px;border:1px solid #e5e7eb;overflow:hidden}table{width:100%;border-collapse:collapse;font-size:13px}thead{background:#1a1a2e;color:white}th{padding:12px 14px;text-align:left;font-weight:500;font-size:12px;white-space:nowrap}td{padding:10px 14px;border-bottom:1px solid #f1f3f5;vertical-align:middle}tr:last-child td{border-bottom:none}tr:hover td{background:#f9fafb}.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}.badge-critico{background:#fee2e2;color:#991b1b}.badge-alto{background:#fef3c7;color:#92400e}.badge-atraso{background:#fff7ed;color:#9a3412}.badge-hoje{background:#ffedd5;color:#9a3412}.badge-avencer{background:#dbeafe;color:#1e40af}.dias-num{font-weight:700;font-size:14px}.dias-red{color:#b91c1c}.dias-amber{color:#92400e}.dias-blue{color:#1d4ed8}.resp{color:#6b7280;font-size:12px}.empty{text-align:center;padding:48px;color:#9ca3af;font-size:14px}.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px;color:#6b7280;font-size:14px}.spinner{width:20px;height:20px;border:2px solid #e5e7eb;border-top-color:#1a1a2e;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error-box{background:#fee2e2;color:#991b1b;padding:16px 20px;border-radius:8px;margin-bottom:20px;font-size:13px;display:none}footer{text-align:center;padding:20px;font-size:12px;color:#9ca3af}</style></head><body><header><div><h1>Oficios MP 2026</h1><div class="subtitle">Demandas pendentes de resposta</div></div><div id="last-update">Carregando...</div></header><div class="container"><div id="error-box" class="error-box"></div><div class="cards"><div class="card total"><div class="label">Total pendentes</div><div class="value" id="c-total">-</div></div><div class="card atrasado"><div class="label">Em atraso</div><div class="value" id="c-atraso">-</div></div><div class="card critico"><div class="label">Critico (&gt;30d)</div><div class="value" id="c-critico">-</div></div><div class="card ok"><div class="label">A vencer</div><div class="value" id="c-ok">-</div></div></div><div class="controls"><button class="filter-btn active" data-filter="all">Todos</button><button class="filter-btn" data-filter="critico">Critico</button><button class="filter-btn" data-filter="alto">Alto</button><button class="filter-btn" data-filter="atraso">Em atraso</button><button class="filter-btn" data-filter="avencer">A vencer</button><input type="text" id="search" placeholder="Buscar..."/></div><div class="table-wrap"><div class="loading" id="loading"><div class="spinner"></div> Carregando...</div><table id="main-table" style="display:none"><thead><tr><th>Oficio</th><th>Vencimento</th><th>Responsavel</th><th style="text-align:center">Dias</th><th style="text-align:center">Situacao</th></tr></thead><tbody id="table-body"></tbody></table><div class="empty" id="empty" style="display:none">Nenhum resultado.</div></div></div><footer>Fonte: Notion - Oficios MP 2026</footer><script>
const T=atob('bnRuXzMzNjYzMDY3NzQ5OEtxS0NEckFZaERvMk92ZmtjSExCdGVacUVKWERVRURlZlU='),D='2e27d679a665812da9cbdabaab1fa104',PROXY='https://notion-proxy.pgmburiticupu.workers.dev';
let rows=[],af='all';
async function load(){
  try{
    const today=new Date();today.setHours(0,0,0,0);
    const r=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({notionToken:T,databaseId:D,payload:{filter:{property:'Respondido',checkbox:{equals:false}},sorts:[{property:'Data do Vencimento',direction:'ascending'}],page_size:100}})});
    if(!r.ok)throw new Error('Erro '+r.status);
    const d=await r.json();
    if(!d.results)throw new Error(JSON.stringify(d).substring(0,100));
    rows=d.results.map(pg=>{
      const pp=pg.properties;
      const titulo=(pp['Número do Expediente']?.title||[]).map(t=>t.plain_text).join('')||pg.id;
      const prazoRaw=pp['Data do Vencimento']?.date?.start||pp['Novo Vencimento']?.date?.start||'';
      const pd=prazoRaw?new Date(prazoRaw+'T00:00:00'):null;
      const da=pd?Math.floor((today-pd)/86400000):null;
      const resp=pp['Responsavel']?.select?.name||pp['Servidor ']?.rich_text?.map(t=>t.plain_text).join('')||'';
      return{t:titulo,p:prazoRaw,d:da,r:resp,u:pg.url};
    });
    rc();rt(af,'');
    document.getElementById('loading').style.display='none';
    document.getElementById('main-table').style.display='table';
    document.getElementById('last-update').textContent='Atualizado: '+new Date().toLocaleString('pt-BR');
  }catch(e){
    document.getElementById('loading').style.display='none';
    const b=document.getElementById('error-box');b.style.display='block';
    b.textContent='Erro: '+e.message;
  }
}
function gc(d){if(d===null)return'sp';if(d>30)return'critico';if(d>=15)return'alto';if(d>=1)return'atraso';return'avencer';}
function gb(d){if(d===null)return'<span class="badge badge-avencer">Sem prazo</span>';if(d>30)return'<span class="badge badge-critico">Critico</span>';if(d>=15)return'<span class="badge badge-alto">Alto</span>';if(d>=1)return'<span class="badge badge-atraso">Em atraso</span>';if(d===0)return'<span class="badge badge-hoje">Vence hoje</span>';return'<span class="badge badge-avencer">A vencer</span>';}
function gd(d){if(d===null)return'-';const c=d>0?(d>30?'dias-red':'dias-amber'):'dias-blue';return'<span class="dias-num '+c+'">'+(d>0?'+'+d:d)+'</span>';}
function rc(){document.getElementById('c-total').textContent=rows.length;document.getElementById('c-atraso').textContent=rows.filter(r=>r.d>0).length;document.getElementById('c-critico').textContent=rows.filter(r=>r.d>30).length;document.getElementById('c-ok').textContent=rows.filter(r=>r.d!==null&&r.d<=0).length;}
function rt(f,s){
  const q=s.toLowerCase();
  const fl=rows.filter(r=>(f==='all'||gc(r.d)===f)&&(!q||r.t.toLowerCase().includes(q)||r.r.toLowerCase().includes(q)));
  const tb=document.getElementById('table-body');
  if(!fl.length){tb.innerHTML='';document.getElementById('main-table').style.display='none';document.getElementById('empty').style.display='block';return;}
  document.getElementById('main-table').style.display='table';document.getElementById('empty').style.display='none';
  tb.innerHTML=fl.map(r=>'<tr><td><a href="'+r.u+'" target="_blank" style="color:#1a1a2e;text-decoration:none;font-weight:500">'+r.t+'</a></td><td style="white-space:nowrap;color:#6b7280">'+(r.p?new Date(r.p+'T00:00:00').toLocaleDateString('pt-BR'):'-')+'</td><td class="resp">'+(r.r||'-')+'</td><td style="text-align:center">'+gd(r.d)+'</td><td style="text-align:center">'+gb(r.d)+'</td></tr>').join('');
}
document.querySelectorAll('.filter-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');af=b.dataset.filter;rt(af,document.getElementById('search').value);}));
document.getElementById('search').addEventListener('input',e=>rt(af,e.target.value));
load();
</script></body></html>
